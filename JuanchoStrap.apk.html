<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JuanchoStrap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #00d4ff;
    font-family: monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 18px;
    margin-bottom: 20px;
    letter-spacing: 0.3em;
    background: linear-gradient(90deg, #00d4ff, #ff2244);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  textarea {
    flex: 1;
    background: #0d0d0d;
    color: #00d4ff;
    border: 1px solid #1a1a1a;
    padding: 15px;
    font-family: monospace;
    font-size: 13px;
    resize: none;
    width: 100%;
    min-height: 300px;
    outline: none;
  }
  textarea:focus { border-color: #00d4ff44; }
  button {
    margin-top: 20px;
    background: #0d0d0d;
    color: #00d4ff;
    border: 1px solid;
    border-image: linear-gradient(90deg, #00d4ff, #ff2244) 1;
    padding: 15px;
    font-family: monospace;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 0.2em;
    cursor: pointer;
    width: 100%;
    text-transform: uppercase;
    background: linear-gradient(90deg, #00d4ff11, #ff224411);
  }
  button:active { opacity: 0.7; }
  #msg {
    margin-top: 10px;
    padding: 10px;
    font-size: 12px;
    text-align: center;
    display: none;
  }
  #msg.ok { color: #00d4ff; border: 1px solid #00d4ff44; }
  #msg.err { color: #ff2244; border: 1px solid #ff224444; }
</style>
</head>
<body>
<h1>JUANCHOSTRAP</h1>
<textarea id="jsonInput">{
  "FFlagDebugDisableGraphicsSettings": false,
  "FFlagEnableNewTechStack": true
}</textarea>
<button onclick="injectFlags()">INJECT FLAGS</button>
<div id="msg"></div>

<script>
const ROBLOX_PATH = '/storage/emulated/0/Android/data/com.roblox.client/files/ClientSettings/ClientAppSettings.json';
const blacklisted = ["FFlagDebugDisableGraphicsSettings", "FFlagEnableNewTechStack"];

function showMsg(text, isError) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = isError ? 'err' : 'ok';
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

function injectFlags() {
  try {
    const raw = document.getElementById('jsonInput').value;
    const parsed = JSON.parse(raw);
    blacklisted.forEach(f => { if (parsed.hasOwnProperty(f)) delete parsed[f]; });
    const content = JSON.stringify(parsed, null, 2);

    // Try Android WebView bridge if available
    if (window.Android && window.Android.writeFile) {
      window.Android.writeFile(ROBLOX_PATH, content);
      showMsg('Inyeccion exitosa. Flags limpias aplicadas.', false);
    } else {
      // Fallback: download as file
      const blob = new Blob([content], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ClientAppSettings.json';
      a.click();
      showMsg('Archivo generado. Copialo a: ' + ROBLOX_PATH, false);
    }
  } catch(e) {
    showMsg('Error: ' + e.message, true);
  }
}
</script>
</body>
</html>
