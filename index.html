<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background: linear-gradient(135deg, #0a0e17 0%, #172554 100%); 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        .card { 
            background: rgba(17, 24, 39, 0.7); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 40px; 
            border-radius: 35px; /* Bordes muy redondeados */
            width: 320px; 
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 { 
            color: #ffffff; 
            font-size: 28px; 
            margin-bottom: 25px; 
            font-weight: 700;
        }

        .editor { 
            width: 100%; 
            height: 140px; 
            background: #020617; 
            border: 2px solid #38bdf8; 
            border-radius: 20px; /* Esquinas redondas en editor */
            color: #38bdf8; 
            padding: 15px; 
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
            margin-bottom: 25px;
            outline: none;
            resize: none;
        }

        .btn { 
            display: block; 
            background: linear-gradient(90deg, #38bdf8, #6366f1);
            color: white; 
            padding: 18px; 
            border-radius: 20px; /* Botón bien redondeado */
            text-decoration: none; 
            font-weight: 800;
            font-size: 16px;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            width: 100%;
        }

        .btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>JuanchoStrap</h1>
        <textarea class="editor">
{
  "FFlagDebugDisableGraphicsSettings": false,
  "FFlagEnableNewTechStack": true
}
        </textarea>
        <button class="btn" onclick="alert('Inyectando configuración...');">INJECT FLAGS</button>
    </div>

</body>
</html>
